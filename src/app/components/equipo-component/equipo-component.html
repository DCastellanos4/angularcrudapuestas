@if (equipo) {
  <main class="min-h-[calc(100vh-80px)] bg-slate-950 px-6 py-12 text-white">
    <section
      class="mx-auto max-w-4xl overflow-hidden rounded-3xl border border-cyan-400/20 bg-slate-900 shadow-2xl shadow-cyan-950/30"
    >
      <div class="grid md:grid-cols-2">
        <div class="flex min-h-72 items-center justify-center bg-slate-950 p-8">
          <img
            [src]="equipo.imagen"
            [alt]="'Escudo de ' + equipo.nombre"
            class="max-h-64 max-w-full object-contain"
          />
        </div>

        <div class="p-8 sm:p-10">
          <p class="text-sm font-bold uppercase tracking-[0.2em] text-cyan-300">Equipo</p>
          <h1 class="mt-3 text-4xl font-black tracking-tight text-white">
            {{ equipo.nombre }}
          </h1>
          <p class="mt-5 leading-7 text-slate-300">
            {{ equipo.descripcion }}
          </p>

          <div class="mt-8 grid grid-cols-2 gap-4">
            <div class="rounded-2xl bg-white/10 p-4">
              <p class="text-sm text-slate-400">Champions</p>
              <p class="mt-1 text-2xl font-bold text-cyan-300">{{ equipo.champions }}</p>
            </div>
            <div class="rounded-2xl bg-white/10 p-4">
              <p class="text-sm text-slate-400">Finalista</p>
              <p class="mt-1 text-2xl font-bold text-cyan-300">{{ equipo.finalista }}</p>
            </div>
          </div>

          <p class="mt-6 text-sm text-slate-400">
            ID del equipo: <span class="font-bold text-white">{{ equipo.idEquipo }}</span>
          </p>

          <a
            [href]="equipo.web"
            target="_blank"
            rel="noopener noreferrer"
            class="mt-6 inline-block rounded-xl bg-cyan-400 px-5 py-3 font-bold text-slate-950 transition-colors hover:bg-cyan-300"
          >
            Web oficial
          </a>
          <br />
          <a
            class="mt-6 inline-block rounded-xl bg-cyan-400 px-5 py-3 font-bold text-slate-950 transition-colors hover:bg-cyan-300"
            [routerLink]="['/jugadores/' + equipo.idEquipo]"
            >Jugadores</a
          >
        </div>
      </div>
    </section>
  </main>
}
