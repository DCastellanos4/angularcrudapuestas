<main class="min-h-screen bg-gradient-to-br from-slate-100 via-slate-50 to-cyan-50 px-6 py-12">
  <section class="mx-auto max-w-lg rounded-3xl border border-slate-200 bg-white p-8 shadow-2xl shadow-slate-300/50 sm:p-10">
    <div class="mb-8">
      <span class="text-sm font-bold uppercase tracking-widest text-cyan-600">Nueva entrada</span>
      <h1 class="mt-2 text-4xl font-black tracking-tight text-slate-900">Crear apuesta</h1>
      <p class="mt-3 text-slate-600">Introduce los datos de la nueva apuesta.</p>
    </div>

    <form crear="ngForm" class="mt-6 space-y-5">
      <div>
        <label for="usuario" class="mb-2 block text-sm font-semibold text-slate-700">
          Usuario
        </label>
        <input
          id="usuario"
          type="text"
          #usuario
          name="usuario"
          class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-slate-800 outline-none transition focus:border-cyan-600 focus:bg-white focus:ring-4 focus:ring-cyan-100"
          placeholder="Nombre del usuario"
        />
      </div>

      <div>
        <label for="resultado" class="mb-2 block text-sm font-semibold text-slate-700">
          Resultado
        </label>
        <input
          id="resultado"
          type="text"
          #resultado
          name="resultado"
          class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-slate-800 outline-none transition focus:border-cyan-600 focus:bg-white focus:ring-4 focus:ring-cyan-100"
          placeholder="Resultado de la apuesta"
        />
      </div>

      <div>
        <label for="fecha" class="mb-2 block text-sm font-semibold text-slate-700">
          Fecha
        </label>
        <input
          id="fecha"
          type="text"
          #fecha
          name="fecha"
          class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-slate-800 outline-none transition focus:border-cyan-600 focus:bg-white focus:ring-4 focus:ring-cyan-100"
          placeholder="DD/MM/AAAA"
        />
      </div>

      <button
        type="button"
        (click)="create()"
        class="w-full rounded-xl bg-cyan-500 px-4 py-3 font-bold text-slate-950 shadow-lg shadow-cyan-500/20 transition-all hover:-translate-y-0.5 hover:bg-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:ring-offset-2"
      >
        Crear apuesta
      </button>
    </form>
  </section>
</main>
