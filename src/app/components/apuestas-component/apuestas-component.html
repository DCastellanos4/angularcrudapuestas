@if (modal != false) {
  <main class="min-h-screen bg-gradient-to-br from-slate-100 via-slate-50 to-cyan-50 px-6 py-12">
    <section class="mx-auto max-w-5xl">
      <div class="mb-8 flex items-end justify-between gap-4">
        <div>
          <span class="text-sm font-bold uppercase tracking-widest text-cyan-600">Panel de control</span>
          <h1 class="mt-2 text-4xl font-black tracking-tight text-slate-900">Apuestas</h1>
          <p class="mt-2 text-slate-600">Consulta y gestiona las apuestas registradas.</p>
        </div>
        <div class="hidden rounded-2xl bg-slate-900 px-5 py-3 text-right shadow-lg sm:block">
          <span class="block text-xs uppercase tracking-wide text-slate-400">Estado</span>
          <span class="font-bold text-cyan-300">Activo</span>
        </div>
      </div>

      <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl shadow-slate-300/50">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-600">
            <thead class="bg-slate-900 text-xs uppercase tracking-wider text-cyan-100">
              <tr>
                <th scope="col" class="px-6 py-4">ID</th>
                <th scope="col" class="px-6 py-4">Usuario</th>
                <th scope="col" class="px-6 py-4">Resultado</th>
                <th scope="col" class="px-6 py-4">Fecha</th>
                <th scope="col" class="px-6 py-4">Eliminar</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let apuesta of apuestas" class="border-b border-slate-100 transition-colors last:border-b-0 hover:bg-cyan-50/60">
                <td class="whitespace-nowrap px-6 py-4 font-medium text-slate-900">
                  {{ apuesta.idApuesta }}
                </td>
                <td class="px-6 py-4">{{ apuesta.usuario }}</td>
                <td class="px-6 py-4">{{ apuesta.resultado }}</td>
                <td class="px-6 py-4">{{ apuesta.fecha }}</td>
                <td class="px-6 py-4">
                  <button
                    type="button"
                    (click)="changeModal(apuesta)"
                    class="rounded-lg bg-red-500 px-4 py-2 font-bold text-white shadow-sm transition-all hover:bg-red-600 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2"
                  >
                    Eliminar
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
} @else {
  <main class="flex min-h-[calc(100vh-80px)] items-center justify-center bg-slate-950/95 px-6 py-12">
    <app-delete-component
      class="w-full max-w-lg"
      (closeModal)="changeModal(apuestaModal)"
      (deleted)="reloadApuestas()"
      [apuesta]="apuestaModal"
    ></app-delete-component>
  </main>
}
