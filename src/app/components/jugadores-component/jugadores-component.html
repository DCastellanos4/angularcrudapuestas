<main class="min-h-[calc(100vh-80px)] bg-slate-950 px-6 py-12 text-white">
  <section class="mx-auto max-w-7xl">
    <div class="mb-8">
      <p class="text-sm font-bold uppercase tracking-[0.2em] text-cyan-300">Equipo {{ id }}</p>
      <h1 class="mt-2 text-4xl font-black tracking-tight">Jugadores</h1>
    </div>

    <div class="overflow-x-auto rounded-2xl border border-cyan-400/20 bg-slate-900 shadow-xl">
      <table class="w-full min-w-[900px] text-left text-sm">
        <thead class="bg-cyan-400 text-xs uppercase tracking-wider text-slate-950">
          <tr>
            <th class="px-6 py-4">Imagen</th>
            <th class="px-6 py-4">ID</th>
            <th class="px-6 py-4">Nombre</th>
            <th class="px-6 py-4">Posición</th>
            <th class="px-6 py-4">Fecha de nacimiento</th>
            <th class="px-6 py-4">País</th>
            <th class="px-6 py-4">ID equipo</th>
          </tr>
        </thead>
        <tbody>
          @for (jugador of jugadores; track jugador.idJugador) {
            <tr class="border-t border-white/10 transition-colors hover:bg-white/5">
              <td class="px-6 py-4">
                <img
                  [src]="jugador.imagen"
                  [alt]="jugador.nombre"
                  class="h-14 w-14 rounded-full object-cover"
                >
              </td>
              <td class="px-6 py-4 text-slate-300">{{ jugador.idJugador }}</td>
              <td class="px-6 py-4 font-bold text-white">{{ jugador.nombre }}</td>
              <td class="px-6 py-4 text-slate-300">{{ jugador.posicion }}</td>
              <td class="px-6 py-4 text-slate-300">{{ jugador.fechaNacimiento }}</td>
              <td class="px-6 py-4 text-slate-300">{{ jugador.pais }}</td>
              <td class="px-6 py-4 text-slate-300">{{ jugador.idEquipo }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </section>
</main>
