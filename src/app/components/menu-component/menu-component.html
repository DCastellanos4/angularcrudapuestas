<nav class="border-b border-cyan-400/20 bg-slate-950 text-white shadow-xl">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-5">
    <a
      href="/"
      class="text-2xl font-black tracking-tight text-cyan-300 transition-colors hover:text-cyan-200"
    >
      Apuestas<span class="text-white">.</span>
    </a>

    <ul class="flex items-center gap-2 text-sm font-semibold">
      <li>
        <a
          [routerLink]="['/']"
          class="rounded-full px-4 py-2 transition-colors hover:bg-cyan-400/10 hover:text-cyan-300"
        >
          Inicio
        </a>
      </li>
      <li>
        <a
          [routerLink]="['/apuestas']"
          class="rounded-full px-4 py-2 transition-colors hover:bg-cyan-400/10 hover:text-cyan-300"
        >
          Apuestas
        </a>
      </li>
      <li>
        <a
          [routerLink]="['/crear']"
          class="rounded-full bg-cyan-500 px-4 py-2 text-slate-950 transition-colors hover:bg-cyan-300"
        >
          Apostar
        </a>
      </li>
      <select (change)="irAEquipos($event)">
        @for (e of equipos; track e) {
          <option value="{{ e.idEquipo }}">
            {{ e.nombre }}
          </option>
        }
      </select>
    </ul>
  </div>
</nav>
