<section class="rounded-3xl border border-red-200 bg-white p-8 shadow-2xl shadow-black/30">
  <div class="flex h-12 w-12 items-center justify-center rounded-full bg-red-100 text-xl text-red-600">!</div>
  <h2 class="mt-5 text-2xl font-black text-slate-900">Eliminar apuesta</h2>
  <p class="mt-2 text-slate-600">
    ¿Quieres eliminar la apuesta de
    <span class="font-semibold text-slate-800">{{ apuesta.usuario }}</span
    >?
  </p>
  <dl   class="mt-5 space-y-2 rounded-xl border border-slate-200 bg-slate-50 p-4 text-sm text-slate-600">
    <div class="flex justify-between gap-4">
      <dt class="font-medium">Resultado</dt>
      <dd>{{ apuesta.resultado }}</dd>
    </div>
    <div class="flex justify-between gap-4">
      <dt class="font-medium">Fecha</dt>
      <dd>{{ apuesta.fecha }}</dd>
    </div>
  </dl>
  <div class="mt-7 flex flex-col-reverse gap-3 sm:flex-row">
    <button
      type="button"
      (click)="eliminar(apuesta.idApuesta)"
      class="flex-1 rounded-xl bg-red-500 px-4 py-3 font-bold text-white shadow-lg shadow-red-500/20 transition-all hover:bg-red-600 hover:shadow-xl"
    >
      Eliminar
    </button>
    <button
      type="button"
      (click)="cancel()"
      class="flex-1 rounded-xl border border-slate-300 bg-white px-4 py-3 font-bold text-slate-700 transition-colors hover:bg-slate-100"
    >
      Cancelar
    </button>
  </div>
</section>
